<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.png" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="admin-css/admin-dashboard.css" />
    <title>Admin Dashboard | SKConnect</title>
  </head>

  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar" id="admin-sidebar">
        <div class="admin-brand">
          <img src="../assets/images/favicon.png" alt="" />
          <span>SKConnect Admin</span>
        </div>

        <nav class="admin-navigation" aria-label="Admin navigation">
          <a class="admin-navigation-link is-active" href="admin-dashboard.html" aria-current="page">
            Dashboard
          </a>
          <a class="admin-navigation-link" href="admin-announcements.html">
            Announcements
          </a>
          <a class="admin-navigation-link" href="admin-accomplishments.html">
            Accomplishments
          </a>
          <a class="admin-navigation-link" href="admin-settings.html">
            Settings
          </a>
        </nav>

        <a class="admin-logout" href="../index.html">Log out</a>
      </aside>

      <div class="admin-main">
        <header class="admin-header">
          <button
            class="admin-menu-toggle"
            type="button"
            aria-label="Open admin navigation"
            aria-expanded="false"
            aria-controls="admin-sidebar"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
          <p class="admin-header-label">Administration</p>
        </header>

        <main class="admin-content">
          <div class="admin-page-heading">
            <p class="admin-eyebrow">Overview</p>
            <h1>Dashboard</h1>
            <p>Manage SKConnect content for the youth of Barangay Sta. Rita.</p>
          </div>

          <section class="admin-empty-content" aria-labelledby="dashboard-content-title">
            <h2 id="dashboard-content-title">Dashboard overview</h2>
            <p>
              Dashboard statistics and recent activity will appear here as the
              administrative features are added.
            </p>
          </section>
        </main>
      </div>
    </div>

    <script src="admin-js/admin-dashboard.js"></script>
  </body>
</html>
