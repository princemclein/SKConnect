<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.png" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="admin-css/admin-settings.css" />
    <title>Admin Settings | SKConnect</title>
  </head>

  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar" id="admin-sidebar">
        <div class="admin-brand">
          <img src="../assets/images/favicon.png" alt="" />
          <span>SKConnect Admin</span>
        </div>
        <nav class="admin-navigation" aria-label="Admin navigation">
          <a class="admin-navigation-link" href="admin-dashboard.html">Dashboard</a>
          <a class="admin-navigation-link" href="admin-announcements.html">Announcements</a>
          <a class="admin-navigation-link" href="admin-accomplishments.html">Accomplishments</a>
          <a class="admin-navigation-link is-active" href="admin-settings.html" aria-current="page">
            Settings
          </a>
        </nav>
        <a class="admin-logout" href="../index.html">Log out</a>
      </aside>

      <div class="admin-main">
        <header class="admin-header">
          <button class="admin-menu-toggle" type="button" aria-label="Open admin navigation" aria-expanded="false" aria-controls="admin-sidebar">
            <span></span><span></span><span></span>
          </button>
          <p class="admin-header-label">Administration</p>
        </header>

        <main class="admin-content">
          <div class="admin-page-heading">
            <p class="admin-eyebrow">Account management</p>
            <h1>Settings</h1>
            <p>Manage your administrator account information and password.</p>
          </div>

          <form class="settings-form" id="settings-form">
            <section class="settings-section" aria-labelledby="account-title">
              <h2 id="account-title">Account information</h2>
              <div class="form-field">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" required />
              </div>
              <div class="form-field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required />
              </div>
            </section>

            <section class="settings-section" aria-labelledby="password-title">
              <h2 id="password-title">Change password</h2>
              <div class="form-field">
                <label for="current-password">Current password</label>
                <input id="current-password" name="current-password" type="password" autocomplete="current-password" />
              </div>
              <div class="form-field">
                <label for="new-password">New password</label>
                <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="8" />
              </div>
              <div class="form-field">
                <label for="confirm-password">Confirm new password</label>
                <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" />
              </div>
              <p class="field-help">Password changes require backend authentication and are not connected yet.</p>
            </section>

            <p class="form-status" id="form-status" role="status" hidden></p>
            <div class="form-actions">
              <button class="admin-secondary-action" type="reset">Cancel</button>
              <button class="admin-primary-action" type="submit">Save settings</button>
            </div>
          </form>
        </main>
      </div>
    </div>
    <script src="admin-js/admin-settings.js"></script>
  </body>
</html>
