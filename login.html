<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="assets/images/favicon.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/login.css" />
    <title>Admin Login | SKConnect</title>
  </head>
  <body>
    <main class="login-page">
      <section class="login-welcome" aria-labelledby="welcome-title">
        <div class="welcome-content">
          <div class="welcome-logos" aria-label="SKConnect partner logos">
            <img
              src="assets/images/brgycouncil_logo.png"
              alt="Barangay Sta. Rita Logo"
            />
            <img
              src="assets/images/skcouncil_logo.png"
              alt="SK Sta. Rita Logo"
            />
            <img
              src="assets/images/favicon.png"
              alt="SKConnect icon"
            />
          </div>

          <div class="welcome-copy">
            <h1 id="welcome-title">Welcome, SK!</h1>
            <p>
              Sign in to manage announcements, projects, and community updates
              for Barangay Sta. Rita.
            </p>
          </div>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-card">
          <p class="eyebrow">Admin access</p>
          <h2 id="login-title">Sign in to your account</h2>
          <p class="login-intro">
            Enter your email and password to continue to the admin dashboard.
          </p>

          <form action="admin.html" method="get">
            <div class="form-field">
              <label for="email">Email address</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="form-field">
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
              />
            </div>

            <button class="login-button" type="submit">Login</button>
          </form>

          <p class="demo-note">Demo only — no authentication is connected.</p>
        </div>
      </section>
    </main>
  </body>
</html>
